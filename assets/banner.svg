<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">JOSUÉ DANIEL CASTILLO — Full Stack Software Developer</title>
  <desc id="bannerDesc">Cabecera de ingeniería de software en azul eléctrico, violeta y cian. Sistemas web, APIs y aplicaciones móviles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#070B15"/>
      <stop offset="1" stop-color="#0C1021"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#67E8F9"/>
      <stop offset="0.48" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="glowViolet">
      <stop stop-color="#8B5CF6" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#64748B" stroke-opacity="0.06"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="410" rx="20"/></clipPath>
    <style>
      .signal { stroke-dasharray: 4 22; animation: flow 9s linear infinite; }
      .halo { animation: breathe 8s ease-in-out infinite; }
      @keyframes flow { to { stroke-dashoffset: -104; } }
      @keyframes breathe { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .signal, .halo { animation: none; } }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="410" fill="url(#bg)"/>
    <rect width="1200" height="410" fill="url(#grid)"/>
    <ellipse class="halo" cx="1040" cy="210" rx="380" ry="310" fill="url(#glowViolet)"/>
    <path d="M64 0H1136" stroke="url(#lineGrad)" stroke-width="3"/>

    <g font-family="Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="2">
      <path d="M64 51H82" stroke="#22D3EE" stroke-width="2"/>
      <text x="96" y="55" fill="#A5B4CF">SOFTWARE ENGINEERING</text>
      <text x="1136" y="55" fill="#8090AB" text-anchor="end">DANIEL040902 / NICARAGUA</text>
    </g>

    <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
      <text x="60" y="161" fill="#F1F5F9" font-size="70" font-weight="700" letter-spacing="-2">JOSUÉ DANIEL</text>
      <text x="59" y="253" fill="url(#nameGrad)" font-size="92" font-weight="700" letter-spacing="4">CASTILLO</text>
      <text x="64" y="301" fill="#CAD5EB" font-size="27" font-weight="400">Full Stack Software Developer</text>
    </g>

    <path d="M64 335H676" stroke="#24314B"/>
    <text x="64" y="368" fill="#8F9FB9" font-family="Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="1.2">WEB SYSTEMS / REST APIs / MOBILE APPLICATIONS</text>

    <g font-family="Consolas, 'Liberation Mono', monospace">
      <text x="788" y="110" fill="#8090AB" font-size="10" letter-spacing="2">APPLICATION LAYERS</text>
      <g fill="none" stroke="#344263" stroke-width="1.5">
        <path d="M864 193V211H1048V193M956 211V233M956 285V311"/>
        <path class="signal" d="M864 193V211H956V233M1048 193V211H956M956 285V311" stroke="#22D3EE"/>
      </g>
      <g fill="#10182A" stroke="#293752">
        <rect x="788" y="133" width="152" height="60" rx="9"/>
        <rect x="972" y="133" width="152" height="60" rx="9"/>
        <rect x="788" y="233" width="336" height="52" rx="9"/>
        <rect x="788" y="311" width="336" height="42" rx="9"/>
      </g>
      <g font-size="10" letter-spacing="1.6">
        <text x="804" y="153" fill="#67E8F9">WEB</text>
        <text x="988" y="153" fill="#B9A3F7">MOBILE</text>
        <text x="804" y="264" fill="#67E8F9">API</text>
        <text x="804" y="337" fill="#8090AB">DATA</text>
      </g>
      <g fill="#DFE7F6" font-size="14">
        <text x="804" y="176">React</text>
        <text x="988" y="176" font-size="12">React Native</text>
        <text x="1106" y="265" text-anchor="end">Laravel</text>
        <text x="1106" y="338" text-anchor="end">PostgreSQL</text>
      </g>
      <text x="956" y="379" fill="#8F9FB9" font-size="11" text-anchor="middle" letter-spacing="1">DOCKER / LINUX</text>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="408.5" rx="20" fill="none" stroke="#24314B" stroke-width="1.5"/>
</svg>
