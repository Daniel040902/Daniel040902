<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Josué Daniel Castillo Valverde — Full Stack Developer</title>
  <desc id="bannerDesc">Banner animado con degradado azul eléctrico, violeta y cian.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="55%" stop-color="#070B1F"/>
      <stop offset="100%" stop-color="#0A0A1E"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="45%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#A78BFA"/>
      <animate attributeName="x1" values="-0.6;0.1;-0.6" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.3;1.2;0.3" dur="9s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="35%" stop-color="#22D3EE"/>
      <stop offset="70%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#1E3A8A" stroke-width="1" stroke-opacity="0.35"/>
    </pattern>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <clipPath id="frame">
      <rect width="1200" height="340" rx="24"/>
    </clipPath>

    <style>
      .fade-up { opacity: 0; animation: fadeUp 1.1s cubic-bezier(.2,.8,.2,1) forwards; }
      .fade-in { opacity: 0; animation: fadeIn 1.4s ease forwards; }
      .d1 { animation-delay: .15s; }
      .d2 { animation-delay: .35s; }
      .d3 { animation-delay: .55s; }
      .d4 { animation-delay: .75s; }
      .d5 { animation-delay: .95s; }
      .pulse { animation: pulse 4s ease-in-out infinite; }
      .drift { animation: drift 12s ease-in-out infinite; }
      .spin { transform-origin: 1000px 170px; animation: spin 26s linear infinite; }
      .spin-rev { transform-origin: 1000px 170px; animation: spin 18s linear infinite reverse; }

      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(22px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes pulse {
        0%, 100% { opacity: .35; }
        50% { opacity: .85; }
      }
      @keyframes drift {
        0%, 100% { transform: translate3d(0,0,0); }
        50% { transform: translate3d(0,-16px,0); }
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .fade-up, .fade-in, .pulse, .drift, .spin, .spin-rev { animation: none; opacity: 1; }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)" opacity="0.55"/>

    <circle class="drift" cx="180" cy="40" r="260" fill="url(#glowCyan)" opacity="0.5"/>
    <circle class="drift" cx="1060" cy="300" r="300" fill="url(#glowViolet)" opacity="0.5"/>

    <g opacity="0.5" fill="#22D3EE">
      <circle cx="560" cy="70" r="2">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="760" cy="120" r="2.5">
        <animate attributeName="opacity" values="1;0.2;1" dur="4.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="660" cy="290" r="2">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g class="spin" fill="none" stroke="#8B5CF6" stroke-opacity="0.45">
      <circle cx="1000" cy="170" r="122" stroke-width="1" stroke-dasharray="4 10"/>
    </g>
    <g class="spin-rev" fill="none" stroke="#22D3EE" stroke-opacity="0.5">
      <circle cx="1000" cy="170" r="96" stroke-width="1.5" stroke-dasharray="30 14"/>
    </g>

    <circle cx="1000" cy="170" r="70" fill="#0A1029" stroke="#2563EB" stroke-opacity="0.6"/>
    <circle class="pulse" cx="1000" cy="170" r="70" fill="none" stroke="#22D3EE" stroke-width="1.5" filter="url(#soft)"/>

    <g fill="#E2E8F0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="34" text-anchor="middle">
      <text x="1000" y="183" fill="url(#nameGrad)">&lt;/&gt;</text>
    </g>
    <text x="1000" y="213" fill="#7DD3FC" fill-opacity="0.75" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" letter-spacing="3" text-anchor="middle">FULL STACK</text>

    <circle cx="1000" cy="48" r="4" fill="#22D3EE">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1122" cy="170" r="3.5" fill="#A78BFA">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="292" r="3" fill="#60A5FA">
      <animate attributeName="opacity" values="1;0.3;1" dur="3.6s" repeatCount="indefinite"/>
    </circle>

    <g class="fade-in d1">
      <rect x="72" y="62" width="4" height="18" rx="2" fill="#22D3EE"/>
      <text x="88" y="77" fill="#67E8F9" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" letter-spacing="4">FULL STACK DEVELOPER</text>
    </g>

    <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="800">
      <text class="fade-up d2" x="70" y="150" fill="url(#nameGrad)" font-size="58" letter-spacing="1">JOSUÉ DANIEL</text>
      <text class="fade-up d3" x="70" y="212" fill="#F1F5F9" font-size="50" letter-spacing="6">CASTILLO VALVERDE</text>
    </g>

    <g class="fade-up d4">
      <rect x="72" y="240" width="300" height="3" rx="1.5" fill="url(#lineGrad)"/>
      <text x="72" y="282" fill="#94A3B8" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" letter-spacing="2">UNAN-León · Nicaragua</text>
      <text x="72" y="308" fill="#A78BFA" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" letter-spacing="2">React · Laravel · PostgreSQL · Docker</text>
    </g>

    <rect x="0" y="336" width="1200" height="4" fill="url(#lineGrad)" opacity="0.9">
      <animate attributeName="x" values="-1200;1200" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="0.75" y="0.75" width="1198.5" height="338.5" rx="24" fill="none" stroke="#1E3A8A" stroke-width="1.5"/>
</svg>
